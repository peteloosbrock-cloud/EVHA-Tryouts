function seasonError(e){return e.code==='permission-denied'?'Access denied. Ask the organizer to grant your account access and publish the supplied Firebase rules.':e.message||'Could not save. Check your connection.'}
function seasonLogin(){
 $('tabs').style.display='none';$('progress').hidden=true;
 $('v').innerHTML='<div class="card"><h2>In-season assessments</h2><p>Coaches sign in with their own account. Your organizer must grant access to your team.</p><label>Email</label><input id="ce" type="email" autocomplete="email"><label>Password</label><input id="cp" type="password" autocomplete="current-password"><div class="row"><button id="csi" class="pri">Sign in</button><button id="cc">Create coach account</button><button id="cr">Reset password</button></div><div id="coachOpen"></div><p id="cmsg" role="status"></p><button id="cback">Back</button></div>';
 async function signin(create){try{await (create?createUserWithEmailAndPassword(auth,$('ce').value.trim(),$('cp').value):signInWithEmailAndPassword(auth,$('ce').value.trim(),$('cp').value));showOpen()}catch(e){$('cmsg').textContent=authError(e)}}
 function showOpen(){if(!auth.currentUser||auth.currentUser.isAnonymous)return;$('coachOpen').innerHTML='<p>Signed in: '+esc(auth.currentUser.email)+'</p><label>Your account ID — give this to your organizer</label><input readonly value="'+esc(auth.currentUser.uid)+'"><label>Team code</label><input id="ct" autocapitalize="characters"><button id="co" class="pri">Open team</button>';$('co').onclick=async()=>{try{await openSeason(normalizeCode($('ct').value))}catch(e){if($('cmsg'))$('cmsg').textContent=seasonError(e)}}}
 $('csi').onclick=()=>signin(false);$('cc').onclick=()=>signin(true);$('cr').onclick=async()=>{try{await sendPasswordResetEmail(auth,$('ce').value.trim());$('cmsg').textContent='Check your email for reset instructions.'}catch(e){$('cmsg').textContent=authError(e)}};$('cback').onclick=renderLogin;showOpen();
}
function seasonOwnerDialog(){
 if(!isOwner())return;
 var el=managementDialog('In-season teams','<p>Create a team using a names-only copy of this tryout roster. No numbers, scores, rankings, or evaluator comments are copied.</p><label>Team name</label><input id="stn" maxlength="80"><label>Season</label><input id="sy" maxlength="40" placeholder="2026–27"><button id="stcreate" class="pri">Create team</button><hr><label>Existing team code</label><input id="stcode"><button id="stopen">Open team</button><p id="stmsg" role="status"></p>');
 $('stcreate').onclick=async function(){this.disabled=true;try{var name=$('stn').value.trim(),season=$('sy').value.trim();if(!name||!season)throw Error('Enter a team name and season.');var id='TEAM-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');var candidates=players.filter(p=>p.name&&p.name.trim()).map(p=>({id:p.id,name:p.name.trim()}));if(!candidates.length)throw Error('Add player names to the tryout roster first.');await setDoc(doc(fs,'seasonTeams',id),{name,season,ownerUid:auth.currentUser.uid,sourceEvent:code,coachUids:[],candidateNames:candidates,roster:[],metrics:[],createdAt:Date.now()});el.close();await openSeason(id)}catch(e){$('stmsg').textContent=seasonError(e);this.disabled=false}};
 $('stopen').onclick=async()=>{try{var id=normalizeCode($('stcode').value),d=await getDoc(doc(fs,'seasonTeams',id));if(!d.exists()||d.data().ownerUid!==auth.currentUser.uid)throw Error('Team not found or you do not own it.');el.close();await openSeason(id)}catch(e){$('stmsg').textContent=seasonError(e)}};
}
async function openSeason(id){
 var snap=await getDoc(doc(fs,'seasonTeams',id));if(!snap.exists())throw Error('Team not found.');var data=snap.data();if(data.ownerUid!==auth.currentUser.uid&&!(data.coachUids||[]).includes(auth.currentUser.uid))throw Error('Coach access required.');
 stopEvent();seasonTeam={...data,id};myId=auth.currentUser.uid;seasonTab='roster';var attempt=connectionId;
 function denied(){if(attempt!==connectionId)return;stopEvent();seasonLogin();$('cmsg').textContent='Team access ended. Contact your organizer.'}
 unsubs.push(onSnapshot(doc(fs,'seasonTeams',id),d=>{if(attempt!==connectionId)return;if(!d.exists()){denied();return}seasonTeam={...d.data(),id};renderSeason()},denied));
 unsubs.push(onSnapshot(collection(fs,'seasonTeams',id,'sessions'),r=>{if(attempt!==connectionId)return;seasonSessions=r.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);renderSeason()},denied));renderSeason();
}
async function seasonPatch(patch){await setDoc(doc(fs,'seasonTeams',seasonTeam.id),patch,{merge:true})}
function metricSummary(pid,m){var rows=seasonSessions.filter(s=>s.results?.[pid]?.[m.id]!==undefined).map(s=>({date:s.date,value:s.results[pid][m.id]}));if(!rows.length)return {rows,text:'No results'};var first=rows[0].value,last=rows.at(-1).value,delta=last-first,improve=m.direction==='lower'?-delta:delta;return {rows,text:rows.length<2?'Baseline recorded':(delta>0?'+':'')+Number(delta.toFixed(4))+' '+m.unit+' · '+(improve>0?'Improved':improve<0?'Decreased performance':'Unchanged')+(first!==0?' · '+Number((improve/Math.abs(first)*100).toFixed(1))+'%':'')}}
function playerReport(pid){var p=seasonTeam.roster.find(p=>p.id===pid);return '<h2>'+esc(p.name)+'</h2><p>'+esc(seasonTeam.name)+' · '+esc(seasonTeam.season)+'</p>'+seasonTeam.metrics.map(m=>{var a=metricSummary(pid,m);return '<h3>'+esc(m.name)+' ('+esc(m.unit)+')</h3><p>'+esc(a.text)+'</p><table><thead><tr><th>Date</th><th>Result</th></tr></thead><tbody>'+a.rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.value)+'</td></tr>').join('')+'</tbody></table>'}).join('')}
function exportPlayer(pid){var p=seasonTeam.roster.find(p=>p.id===pid),body='<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(p.name)+' Progress</title><style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:20px;color:#123}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}@media print{body{margin:0}}</style>'+playerReport(pid)+'</html>',url=URL.createObjectURL(new Blob([body],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download=slug(p.name)+'-progress.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderSeason(){
 if(!seasonTeam)return;var t=seasonTeam,owner=t.ownerUid===auth.currentUser?.uid;
 $('accountBar').style.display='flex';$('tabs').style.display='none';$('progress').hidden=true;$('sub').textContent='In-season · '+t.name+' · '+t.season+' · '+t.id;
 $('v').innerHTML='<div class="card"><h2>'+esc(t.name)+'</h2><p>Team code: <b>'+esc(t.id)+'</b></p><div class="row">'+['roster','metrics','assessment','progress'].concat(owner?['access']:[]).map(x=>'<button data-stab="'+x+'" class="'+(seasonTab===x?'pri':'')+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div></div><div class="card" id="seasonBody"></div><p id="smsg" role="status"></p>';
 document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{seasonTab=b.dataset.stab;renderSeason()});var b=$('seasonBody');
 function action(fn){return async function(){this.disabled=true;try{await fn();if($('smsg'))$('smsg').textContent='Saved ✓'}catch(e){if($('smsg'))$('smsg').textContent=seasonError(e)}finally{if(this.isConnected)this.disabled=false}}}
 if(seasonTab==='roster'){
 b.innerHTML='<h3>Build team roster</h3><p>Select player names. Unchecking a player removes them from future sessions; saved results remain available when reselected. Duplicate names are separate roster entries.</p>'+t.candidateNames.map(p=>'<label style="display:block"><input style="width:auto" type="checkbox" data-roster="'+esc(p.id)+'" '+(t.roster.some(x=>x.id===p.id)?'checked':'')+'> '+esc(p.name)+'</label>').join('')+'<button id="sr" class="pri">Save roster</button>';$('sr').onclick=action(async()=>{var ids=Array.from(document.querySelectorAll('[data-roster]:checked'),x=>x.dataset.roster);await seasonPatch({roster:t.candidateNames.filter(p=>ids.includes(p.id))})});
 }else if(seasonTab==='metrics'){
 b.innerHTML='<h3>Objective metrics · up to 6</h3><p>Enter actual results, such as sprint seconds, shot MPH, or repetitions. Use the same test protocol each time. Metrics lock after the first saved session to keep progress comparable.</p>'+Array.from({length:6},(_,i)=>{var m=t.metrics[i]||{};return '<div class="row"><input aria-label="Metric '+(i+1)+' name" data-mname maxlength="60" placeholder="Metric '+(i+1)+'" value="'+esc(m.name||'')+'"><input aria-label="Unit '+(i+1)+'" data-munit maxlength="20" placeholder="seconds / MPH / reps" value="'+esc(m.unit||'')+'"><select aria-label="Improvement direction '+(i+1)+'" data-mdir><option value="higher">Higher is better</option><option value="lower" '+(m.direction==='lower'?'selected':'')+'>Lower is better</option></select></div>'}).join('')+'<button id="sm" class="pri">Save metrics</button>';
 if(t.metricsLocked||seasonSessions.length)b.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);
 $('sm').onclick=action(async()=>{var names=[...b.querySelectorAll('[data-mname]')],units=[...b.querySelectorAll('[data-munit]')],dirs=[...b.querySelectorAll('[data-mdir]')],metrics=[];names.forEach((n,i)=>{if(!n.value.trim()){if(units[i].value.trim())throw Error('Give each unit a metric name.');return}if(!units[i].value.trim())throw Error('Each metric needs a unit.');metrics.push({id:'m'+i,name:n.value.trim(),unit:units[i].value.trim(),direction:dirs[i].value})});if(!metrics.length||new Set(metrics.map(m=>m.name.toLowerCase())).size!==metrics.length)throw Error('Enter 1–6 distinct metric names.');await seasonPatch({metrics})});
 }else if(seasonTab==='assessment'){
 b.innerHTML='<h3>Dated assessment</h3>'+(!t.metrics.length||!t.roster.length?'<p>Save your roster and metrics first.</p>':'<label>Saved session or new session</label><select id="sess"><option value="">New session</option>'+seasonSessions.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.date+' · '+s.name)+'</option>').join('')+'</select><label>Session name</label><input id="sn" maxlength="80" placeholder="October testing"><label>Assessment date</label><input id="sd" type="date" value="'+new Date().toLocaleDateString('en-CA')+'"><p>Blank means not tested. Zero is a valid result.</p><div class="tw"><table><thead><tr><th>Player</th>'+t.metrics.map(m=>'<th>'+esc(m.name)+'<br>'+esc(m.unit)+'</th>').join('')+'</tr></thead><tbody>'+t.roster.map(p=>'<tr><td>'+esc(p.name)+'</td>'+t.metrics.map(m=>'<td><input style="min-width:85px" aria-label="'+esc(p.name+' '+m.name)+'" type="number" min="0" step="any" data-result-player="'+esc(p.id)+'" data-result-metric="'+m.id+'"></td>').join('')+'</tr>').join('')+'</tbody></table></div><button id="ss" class="pri">Save assessment</button>');
 if($('ss')){$('sess').onchange=()=>{var s=seasonSessions.find(s=>s.id===$('sess').value);$('sn').value=s?.name||'';$('sd').value=s?.date||new Date().toLocaleDateString('en-CA');b.querySelectorAll('[data-result-player]').forEach(x=>x.value=s?.results?.[x.dataset.resultPlayer]?.[x.dataset.resultMetric]??'')};$('ss').onclick=action(async()=>{var name=$('sn').value.trim(),date=$('sd').value;if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Enter a session name and date.');var old=seasonSessions.find(s=>s.id===$('sess').value),results=JSON.parse(JSON.stringify(old?.results||{})),count=0;b.querySelectorAll('[data-result-player]').forEach(x=>{var p=x.dataset.resultPlayer,m=x.dataset.resultMetric;results[p]??={};if(x.value===''){delete results[p][m];return}var v=Number(x.value);if(!Number.isFinite(v)||v<0)throw Error('Results must be nonnegative numbers.');results[p][m]=v;count++});if(!count)throw Error('Enter at least one result.');var ref=old?doc(fs,'seasonTeams',t.id,'sessions',old.id):doc(collection(fs,'seasonTeams',t.id,'sessions'));var batch=writeBatch(fs);batch.set(doc(fs,'seasonTeams',t.id),{metricsLocked:true},{merge:true});batch.set(ref,{name,date,results,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now(),by:auth.currentUser.uid});await batch.commit()})}
 }else if(seasonTab==='progress'){
 b.innerHTML='<h3>Player files</h3><p>Each report updates from saved dated sessions. Download an individual report and use Print → Save as PDF if desired.</p>'+t.roster.map(p=>'<div style="border-top:1px solid var(--bd);padding:16px 0"><b>'+esc(p.name)+'</b> <button data-report="'+esc(p.id)+'">View progress</button> <button data-export="'+esc(p.id)+'">Download player file</button></div>').join('');b.querySelectorAll('[data-report]').forEach(x=>x.onclick=()=>managementDialog('Player progress',playerReport(x.dataset.report)));b.querySelectorAll('[data-export]').forEach(x=>x.onclick=()=>exportPlayer(x.dataset.export));
 }else if(owner){
 b.innerHTML='<h3>Coach access</h3><p>Ask the coach to create an account through In-season assessments and give you their account ID. Coach accounts cannot access tryout events. Use a separate account for an organizer who also coaches.</p><label>Coach account ID</label><input id="cuid"><button id="grant" class="pri">Grant coach access</button>'+t.coachUids.map(u=>'<div><code>'+esc(u)+'</code> <button data-revoke="'+esc(u)+'">Remove team access</button></div>').join('');$('grant').onclick=action(async()=>{var uid=$('cuid').value.trim();if(!uid||uid.includes('/')||uid===t.ownerUid)throw Error('Enter a coach account ID, different from your organizer ID.');var batch=writeBatch(fs);batch.set(doc(fs,'seasonCoachAccounts',uid),{coach:true,assignedBy:t.ownerUid,teamId:t.id});batch.set(doc(fs,'seasonTeams',t.id),{coachUids:[...new Set(t.coachUids.concat(uid))]},{merge:true});await batch.commit()});b.querySelectorAll('[data-revoke]').forEach(x=>x.onclick=action(()=>seasonPatch({coachUids:t.coachUids.filter(u=>u!==x.dataset.revoke)})));
 }
}

var app=initializeApp(firebaseConfig);fs=getFirestore(app);auth=getAuth(app);
onAuthStateChanged(auth,function(user){if(myId&&(!user||user.uid!==myId)){stopEvent();renderLogin()}});
auth.authStateReady().then(function(){render();window.dispatchEvent(new Event('pathway-ready'))}).catch(function(){$('v').innerHTML='<div class="card">Could not initialize sign-in. Reload the app.</div>';window.dispatchEvent(new Event('pathway-ready'))});
</script></body></html>
