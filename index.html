function parseRosterCSV(text){

    if(c==='"'){if(cell||closed)throw new Error('Unexpected quote in CSV.');quoted=true}
    else if(c===','){row.push(cell);cell='';closed=false}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';closed=false}

async function assignPlayers(ids,target){if(!isOrganizer())throw Error('Organizer access required.');if(ids.length>499)throw Error('Assign up to 499 players at a time.');if(target&&!groups().includes(target))throw Error('This group no longer exists.');var selected=new Set(ids),numbers=new Set();players.filter(function(p){return target&&(G(p)===target||selected.has(p.id))}).forEach(function(p){var n=String(Number(p.num));if(numbers.has(n))throw Error('Duplicate tryout #'+n+' in the destination group. Assign different numbers first.');numbers.add(n)});var roster=players.filter(function(p){return selected.has(p.id)});if(roster.length!==selected.size)throw Error('A selected player no longer exists.');var batch=writeBatch(fs);roster.forEach(function(p){batch.set(doc(fs,'tryouts',code,'players',p.id),{grp:target,level:p.level||G(p)||''},{merge:true})});await batch.commit();players=players.map(function(p){return selected.has(p.id)?Object.assign({},p,{grp:target,level:p.level||G(p)||''}):p});sel=null;open=null;draft={};nd={}}

$('t1').onclick=function(){tab=1;render()};$('t2').onclick=function(){tab=2;render()};$('t3').onclick=function(){if(isOrganizer()){tab=3;setupDraft=null;render()}};
$('leaveEvent').onclick=function(){stopEvent();renderLogin()};
$('signOutBtn').onclick=async function(){stopEvent();await signOut(auth);renderLogin()};

onAuthStateChanged(auth,function(user){if(myId&&(!user||user.uid!==myId)){stopEvent();renderLogin()}});
