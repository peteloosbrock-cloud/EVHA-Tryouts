<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tryout Scores</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7380;--bd:#e1e5ea;--ac:#1f6feb;--acx:#fff;--ok:#1a7f4b;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mut:#8b95a3;--bd:#2a323d;--ac:#4c8dff;--ok:#3fb97a;--warn:#e5a04a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.danger{color:#b42318;border-color:#f1b4ae;background:var(--card)}button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;margin-bottom:8px}
.row select{flex:1}.setupRow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.setupRow input{margin:0;flex:1}.setupRow button{padding:10px 12px}.pill{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:3px 8px;font-size:12px;color:var(--mut)}
textarea{resize:vertical;margin:0}
.crit{margin:12px 0}.crit b{display:block;margin-bottom:6px;font-size:14px}
.sc{display:flex;gap:6px}.sc button{flex:1;padding:12px 0}
.mut{color:var(--mut);font-size:13px}.warn{color:var(--warn)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.p{cursor:pointer}.big{font-weight:700}
</style></head><body><main>
<h1>Tryout Scores</h1>
<div class="sub" id="sub"></div>
<div class="tabs" id="tabs" style="display:none"><button id="t1" class="on">Score</button><button id="t2">Leaderboard</button><button id="t3">Setup</button></div>
<div id="v"></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== STEP 1: PASTE YOUR FIREBASE CONFIG HERE (see setup steps) ======
const firebaseConfig = {
  apiKey: "AIzaSyAuRve8_OSHyFoggRkNcn-LBRYSDVzZSOk",
  authDomain: "evha-tryout-evaluations.firebaseapp.com",
  projectId: "evha-tryout-evaluations",
  appId: "1:101433588672:web:4f10b23714d40790446625"
};
// =======================================================================

var DEFAULT_C=['Skating','Hockey IQ','Compete Level','Puck Skills'];
var C=DEFAULT_C.slice(),MAX_C=5,SM=10,pm=null,W=equalWeights(DEFAULT_C);
function cleanMax(n){n=Math.round(Number(n));return n>=5&&n<=10?n:10}
function scale(){var a=[];for(var i=1;i<=SM;i++)a.push(i);return a}
function sv(s,c){return (Number(s.v&&s.v[c])||0)*SM/(s.mx||10)}
function mv(m){var o={};if(m)C.forEach(function(c){if(m.v&&m.v[c])o[c]=Math.max(1,Math.min(SM,Math.round(sv(m,c))))});return o}
function shortName(c){return c.length>12?c.slice(0,10)+'…':c}
function cleanCriteria(a){var out=[];(a||[]).forEach(function(x){x=String(x||'').trim();if(x&&out.indexOf(x)<0&&out.length<MAX_C)out.push(x)});return out.length?out:DEFAULT_C.slice()}
function equalWeights(a){var out={},base=Math.floor(100/a.length),left=100-base*a.length;a.forEach(function(c,i){out[c]=base+(i<left?1:0)});return out}
function cleanWeights(raw,a){var out={},sum=0;a.forEach(function(c){var n=Number(raw&&raw[c]);if(isFinite(n)&&n>=0){out[c]=n;sum+=n}});return Math.abs(sum-100)<0.001?out:equalWeights(a)}
function eventRef(){return doc(fs,'tryouts',code)}
function saveCriteria(next,nextW,nextMax){C=cleanCriteria(next);W=cleanWeights(nextW,C);SM=cleanMax(nextMax);return setDoc(eventRef(),{criteria:C,weights:W,scoreMax:SM},{merge:true})}
var players=[],scores=[],tab=1,sel=null,draft={},nd={},open=null,fs=null,code=null,myId=null,myName=null,unsubs=[];
var grp=ls('tg')||null,day=null,bday='all',xg=[],xd={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function f(n){return n.toFixed(2)}
function lab(p){return '#'+esc(p.num||'?')}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x'}
function nat(a,b){return a.localeCompare(b,undefined,{numeric:true})}
function weightedAvg(vals){var total=0,wt=0;C.forEach(function(c,i){var w=Number(W[c])||0;total+=(Number(vals[i])||0)*w;wt+=w});return wt?total/wt:mean(vals)}
function evalOverall(s){return weightedAvg(C.map(function(c){return sv(s,c)}))}
function G(p){return p.grp||'Main'}
function D(s){return s.d||'Day 1'}
function gp(){return players.filter(function(p){return G(p)===grp})}
function gs(){var ids={};gp().forEach(function(p){ids[p.id]=1});return scores.filter(function(s){return ids[s.player]})}
function groups(){var g=[];players.forEach(function(p){if(g.indexOf(G(p))<0)g.push(G(p))});xg.forEach(function(x){if(g.indexOf(x)<0)g.push(x)});if(!g.length)g.push('Main');return g.sort(nat)}
function days(){var d=[];gs().forEach(function(s){if(d.indexOf(D(s))<0)d.push(D(s))});(xd[grp]||[]).forEach(function(x){if(d.indexOf(x)<0)d.push(x)});if(!d.length)d.push('Day 1');return d.sort(nat)}
function fixSel(){
  var gl=groups();if(gl.indexOf(grp)<0)grp=gl[0];
  var dl=days();if(dl.indexOf(day)<0)day=dl[dl.length-1];
  if(bday!=='all'&&dl.indexOf(bday)<0)bday='all';
}
function stats(pid){
  var e=scores.filter(function(s){return s.player===pid&&(bday==='all'||D(s)===bday)});
  var ds=[];e.forEach(function(s){if(ds.indexOf(D(s))<0)ds.push(D(s))});
  // average evaluators within each day, then average the days (each day counts equally)
  var per=C.map(function(c){return mean(ds.map(function(d){return mean(e.filter(function(s){return D(s)===d}).map(function(s){return sv(s,c)}))}))});
  var spread=0;
  ds.forEach(function(d){var os=e.filter(function(s){return D(s)===d}).map(evalOverall);if(os.length>1)spread=Math.max(spread,Math.max.apply(0,os)-Math.min.apply(0,os))});
  return{e:e,n:e.length,days:ds.length,per:per,avg:weightedAvg(per),spread:spread}
}
function mine(pid){return scores.find(function(s){return s.player===pid&&s.by===myId&&D(s)===day})}
function sortP(){return gp().sort(function(a,b){return (+a.num||0)-(+b.num||0)})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function selCard(board){
  var gl=groups(),dl=days();
  return '<div class="card"><div class="row"><select id="gs" style="margin:0">'+gl.map(function(g){return '<option value="'+esc(g)+'"'+(g===grp?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select><button id="ga">+ Group</button></div>'+
   '<div class="row" style="margin-top:8px"><select id="ds" style="margin:0">'+(board?'<option value="all"'+(bday==='all'?' selected':'')+'>All days (average)</option>':'')+dl.map(function(d){return '<option value="'+esc(d)+'"'+(d===(board?bday:day)?' selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select>'+(board?'':'<button id="da">+ Day</button>')+'</div></div>';
}
function bindSel(board){
  $('gs').onchange=function(e){grp=e.target.value;ls('tg',grp);sel=null;open=null;bday='all';render()};
  $('ga').onclick=function(){
    var n=(prompt('New group name (e.g. 10U)')||'').trim();if(!n)return;
    if(groups().indexOf(n)<0)xg.push(n);
    grp=n;ls('tg',n);sel=null;open=null;day=null;bday='all';render();
  };
  $('ds').onchange=function(e){if(board)bday=e.target.value;else day=e.target.value;render()};
  if(!board)$('da').onclick=function(){
    var dl=days(),n=(prompt('New day name',"Day "+(dl.length+1))||'').trim();if(!n)return;
    if(dl.indexOf(n)<0){xd[grp]=(xd[grp]||[]).concat(n)}
    day=n;render();
  };
}

function render(){
  if(!myId){renderLogin();return}
  fixSel();
  $('tabs').style.display='flex';
  $('t1').className=tab==1?'on':'';$('t2').className=tab==2?'on':'';$('t3').className=tab==3?'on':'';
  var m=gp().filter(function(p){return mine(p.id)}).length;
  $('sub').textContent='Evaluator: '+myName+' · '+grp+' · '+gp().length+' players · '+gs().length+' evaluations'+(tab==1?' · you scored '+m+' of '+gp().length+' on '+day:'');
  tab==1?renderScore():tab==2?renderBoard():renderSetup();
}
function renderLogin(){
  $('tabs').style.display='none';
  if(false){$('v').innerHTML='<div class="card">Setup needed: paste your Firebase config into the top of this file.</div>';return}
  $('sub').textContent='';
  $('v').innerHTML='<div class="card"><div class="crit"><b>Event code</b><input id="lc" placeholder="Shared code from the tryout coordinator" autocapitalize="off"></div><div class="crit"><b>Your name or initials</b><input id="ln" placeholder="e.g. Coach Mike"></div><div class="mut" style="margin-bottom:8px">Use a name no other evaluator uses. Your scores are saved under it.</div><button class="pri" id="lg" style="width:100%">Start</button><div class="mut" id="le" style="margin-top:8px"></div></div>';
  $('lc').value=ls('tc')||'';$('ln').value=ls('tn')||'';
  $('lg').onclick=function(){var c=$('lc').value.trim(),n=$('ln').value.trim();if(!c||!n){$('le').textContent='Enter both.';return}start(c,n)};
}
function renderScore(){
  var h=selCard(false)+'<div class="card"><div class="mut" style="margin-bottom:6px">Add tryout numbers to '+esc(grp)+' — e.g. 12, or 1-20, or 4,7,15</div><div class="row"><input id="pu" placeholder="Tryout #" style="flex:1;margin:0"><button class="pri" id="pa">Add</button></div></div>';
  var sp=sortP();
  if(!sp.length){$('v').innerHTML=h+'<div class="card mut">No tryout numbers in '+esc(grp)+' yet.</div>';bindAdd();bindSel(false);return}
  if(!sel||!sp.some(function(p){return p.id===sel}))sel=sp[0].id;
  h+='<div class="card"><select id="ps" style="margin:0">'+sp.map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+lab(p)+(mine(p.id)?' ✓':'')+'</option>'}).join('')+'</select></div>';
  var m=mine(sel),dk=sel+'|'+day;if(!draft[dk])draft[dk]=mv(m);
  var d=draft[dk];if(nd[dk]===undefined)nd[dk]=m&&m.note?m.note:'';
  h+='<div class="card">'+C.map(function(c){return '<div class="crit"><b>'+c+'</b><div class="sc">'+scale().map(function(n){return '<button data-c="'+c+'" data-n="'+n+'" class="'+(d[c]===n?'on':'')+'">'+n+'</button>'}).join('')+'</div></div>'}).join('')+
   '<div class="crit"><b>Comments (optional)</b><textarea id="nt" rows="3" placeholder="Strengths, concerns, position notes…">'+esc(nd[dk])+'</textarea></div><div class="mut">1 = needs work · '+Math.ceil(SM/2)+' = solid · '+SM+' = standout</div><button class="pri" id="sv" style="width:100%;margin-top:10px"'+(C.every(function(c){return d[c]})?'':' disabled')+'>'+(m?'Update my score':'Save my score')+'</button></div>';
  $('v').innerHTML=h;bindAdd();bindSel(false);
  $('nt').oninput=function(e){nd[dk]=e.target.value};
  $('ps').onchange=function(e){sel=e.target.value;render()};
  Array.prototype.forEach.call(document.querySelectorAll('.sc button'),function(b){b.onclick=function(){d[b.dataset.c]=+b.dataset.n;render()}});
  $('sv').onclick=function(){
    var b=$('sv');b.disabled=true;var pid=sel,dy=day,key=dk;
    setDoc(doc(fs,'tryouts',code,'scores',m?m.id:myId+'_'+slug(dy)+'_'+pid),{player:pid,by:myId,who:myName,d:dy,v:Object.assign({},d),mx:SM,note:(nd[key]||'').trim(),t:Date.now()}).then(function(){
      b.textContent='Saved ✓';delete draft[key];delete nd[key];
      setTimeout(function(){var ps=sortP();var i=ps.findIndex(function(p){return p.id===pid});var nx=ps.slice(i+1).concat(ps.slice(0,i)).find(function(p){return !mine(p.id)&&p.id!==pid});if(nx)sel=nx.id;render()},500)
    }).catch(function(){b.disabled=false;b.textContent='Could not save — retry'});
  };
}

function renderSetup(){
  var h='<div class="card"><div class="row"><div><b>Scoring categories & weights</b><div class="mut">Create up to '+MAX_C+' measures. Weights determine the overall leaderboard score and must total 100%.</div></div><span class="pill">'+C.length+'/'+MAX_C+'</span></div><div class="crit"><b>Score scale</b><select id="sm">'+[5,6,7,8,9,10].map(function(n){return '<option value="'+n+'"'+(n===(pm||SM)?' selected':'')+'>1 – '+n+'</option>'}).join('')+'</select><div class="mut">Scores already entered are converted proportionally if you change the scale.</div></div><div id="cr" style="margin-top:12px">';
  C.forEach(function(c,i){h+='<div class="setupRow"><input class="cn" data-i="'+i+'" value="'+esc(c)+'" maxlength="30"><input class="cw" data-i="'+i+'" type="number" min="0" max="100" step="1" value="'+(W[c]===undefined?Math.round(100/C.length):W[c])+'" style="flex:0 0 82px" aria-label="Weight percent"><span style="min-width:18px">%</span><button data-del="'+i+'"'+(C.length<=1?' disabled':'')+'>Remove</button></div>'});
  h+='</div><div class="row"><button id="ca"'+(C.length>=MAX_C?' disabled':'')+'>+ Add category</button><span class="pill" id="wt">Total: 100%</span></div><button class="pri" id="cs" style="width:100%;margin-top:10px">Save setup</button><div class="mut" id="cm" style="margin-top:8px">Scores use a 1–'+SM+' scale. Category weights affect the overall Avg only.</div></div>'+
  '<div class="card"><b>Score data</b><div class="mut" style="margin:4px 0 10px">Clear all evaluation scores for this event. Players, groups, days, categories and weights are kept.</div><button class="danger" id="clearScores" style="width:100%">Clear scores</button><div class="mut" id="clearMsg" style="margin-top:8px"></div></div>';
  $('v').innerHTML=h;
  function totalWeights(){var t=0;Array.prototype.forEach.call(document.querySelectorAll('.cw'),function(i){t+=Number(i.value)||0});$('wt').textContent='Total: '+t+'%';$('wt').className='pill'+(Math.abs(t-100)<0.001?'':' warn');return t}
  Array.prototype.forEach.call(document.querySelectorAll('.cw'),function(i){i.oninput=totalWeights});totalWeights();
  $('sm').onchange=function(){pm=+this.value};
  $('ca').onclick=function(){if(C.length<MAX_C){var old=C.slice(),next=C.concat('Category '+(C.length+1));C=next;W=equalWeights(C);renderSetup()}};
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){if(C.length>1){C=C.filter(function(_,i){return i!==+b.dataset.del});W=equalWeights(C);renderSetup()}}});
  $('cs').onclick=function(){
    var next=[],nextW={},names=document.querySelectorAll('.cn'),weights=document.querySelectorAll('.cw');
    Array.prototype.forEach.call(names,function(i){next.push(i.value.trim())});
    if(next.some(function(x){return !x})||new Set(next).size!==next.length){$('cm').textContent='Each category needs a unique name.';$('cm').className='mut warn';return}
    Array.prototype.forEach.call(weights,function(i,j){nextW[next[j]]=Number(i.value)||0});
    var total=Object.keys(nextW).reduce(function(a,k){return a+nextW[k]},0);
    if(Math.abs(total-100)>0.001){$('cm').textContent='Weights must total exactly 100% before saving.';$('cm').className='mut warn';return}
    var b=$('cs');b.disabled=true;b.textContent='Saving…';
    saveCriteria(next,nextW,pm||SM).then(function(){pm=null;b.textContent='Saved ✓';setTimeout(renderSetup,500)}).catch(function(){b.disabled=false;b.textContent='Could not save — retry'});
  };
  $('clearScores').onclick=function(){
    if(!scores.length){$('clearMsg').textContent='There are no scores to clear.';return}
    var first=confirm('Clear ALL '+scores.length+' evaluation scores for this event? Players and setup will be kept.');
    if(!first)return;
    var phrase=(prompt('This cannot be undone. Type CLEAR to permanently delete all scores.')||'').trim();
    if(phrase!=='CLEAR'){$('clearMsg').textContent='Clear cancelled.';return}
    var b=$('clearScores');b.disabled=true;b.textContent='Clearing…';
    Promise.all(scores.map(function(s){return import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js").then(function(m){return m.deleteDoc(doc(fs,'tryouts',code,'scores',s.id))})})).then(function(){draft={};nd={};$('clearMsg').textContent='All scores cleared ✓';b.textContent='Cleared ✓'}).catch(function(){b.disabled=false;b.textContent='Clear scores';$('clearMsg').textContent='Could not clear every score — retry.'});
  };
}
function bindAdd(){
  var a=$('pa');if(!a)return;
  a.onclick=function(){
    var g=grp,nums=[];$('pu').value.split(',').forEach(function(t){t=t.trim();var m=t.match(/^(\d+)\s*-\s*(\d+)$/);if(m){for(var i=+m[1];i<=+m[2]&&i-m[1]<300;i++)nums.push(String(i))}else if(/^\d+$/.test(t))nums.push(t)});
    nums.forEach(function(n){if(!players.some(function(p){return G(p)===g&&String(p.num)===n}))setDoc(doc(fs,'tryouts',code,'players',slug(g)+'_n'+n),{num:n,grp:g})});
    $('pu').value='';
  };
}
function renderBoard(){
  var rows=gp().map(function(p){return{p:p,s:stats(p.id)}}).sort(function(a,b){return b.s.avg-a.s.avg});
  var h=selCard(true)+'<div class="row" style="margin-bottom:8px"><span class="mut">'+(bday==='all'?'Each day averaged across evaluators, then days averaged equally':'Average across evaluators for '+esc(bday))+'</span><button id="ex">Export CSV</button></div>';
  if(!rows.length){$('v').innerHTML=h+'<div class="card mut">No players in '+esc(grp)+' yet.</div>';bindSel(true);$('ex').onclick=function(){};return}
  h+='<div class="card tw"><table><tr><th>#</th><th>Tryout #</th><th class="n">Avg</th><th class="n">Evals</th><th class="n">Days</th>'+C.map(function(c){return '<th class="n">'+shortName(c)+'</th>'}).join('')+'</tr>';
  rows.forEach(function(r,i){
    var s=r.s;
    h+='<tr class="p" data-id="'+r.p.id+'"><td class="mut">'+(i+1)+'</td><td>'+lab(r.p)+(s.spread>=3*SM/10?' <span class="warn" title="Evaluators disagree">⚠</span>':'')+'</td><td class="n big">'+(s.n?f(s.avg):'–')+'</td><td class="n">'+s.n+'</td><td class="n">'+s.days+'</td>'+s.per.map(function(x){return '<td class="n">'+(s.n?f(x):'–')+'</td>'}).join('')+'</tr>';
    if(open===r.p.id)h+='<tr><td></td><td colspan="'+(4+C.length)+'">'+(s.e.slice().sort(function(a,b){return nat(D(a),D(b))}).map(function(e){return '<div class="mut">'+esc(D(e))+' · '+esc(e.who||e.by)+': <b>'+f(evalOverall(e))+'</b> ('+C.map(function(c){return Math.round(sv(e,c)*10)/10}).join('/')+')'+(e.note?'<div style="color:var(--tx);white-space:normal;margin:2px 0 8px">“'+esc(e.note)+'”</div>':'')+'</div>'}).join('')||'<div class="mut">No scores yet</div>')+'</td></tr>';
  });
  h+='</table></div><div class="mut">Tap a row to see each evaluator. ⚠ = evaluators differ by '+(Math.round(SM*3)/10)+'+ points overall on the same day.</div>';
  $('v').innerHTML=h;bindSel(true);
  Array.prototype.forEach.call(document.querySelectorAll('tr.p'),function(t){t.onclick=function(){open=open===t.dataset.id?null:t.dataset.id;render()}});
  $('ex').onclick=function(){
    var q=function(x){return '"'+String(x).replace(/"/g,'""')+'"'};
    var csv=['Rank,Group,Tryout #,Weighted Average,Evaluations,Days,'+C.map(function(c){return c+' ('+(W[c]||0)+'%)'}).join(',')+',Comments'].concat(rows.map(function(r,i){return [i+1,q(grp),q(r.p.num||''),f(r.s.avg),r.s.n,r.s.days].concat(r.s.per.map(f)).concat([q(r.s.e.filter(function(e){return e.note}).map(function(e){return (e.who||e.by)+' ('+D(e)+'): '+e.note}).join(' | '))]).join(',')})).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tryout-'+slug(grp)+(bday==='all'?'-all-days':'-'+slug(bday))+'.csv';a.click();
  };
}
function start(c,n){
  code=c;myName=n;myId=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'eval';
  ls('tc',c);ls('tn',n);
  unsubs.forEach(function(u){u()});unsubs=[];players=[];scores=[];
